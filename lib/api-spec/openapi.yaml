openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI employee operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/task:
    post:
      operationId: executeAiTask
      tags: [ai]
      summary: Execute a business task with the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTaskRequest"
      responses:
        "200":
          description: Structured task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskResult"
        "400":
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider unavailable or returned an invalid result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiTaskRequest:
      type: object
      properties:
        task:
          type: string
          maxLength: 4000
        companyName:
          type: string
        playerName:
          type: string
      required:
        - task
    AiTaskResult:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        deliverable:
          type: string
        nextSteps:
          type: array
          items:
            type: string
        riskNote:
          type: string
      required:
        - title
        - summary
        - deliverable
        - nextSteps
        - riskNote
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
