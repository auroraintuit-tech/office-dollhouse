kind = "mobile"
previewPath = "/"
title = "OfficeOS"
description = "OfficeOS — мобильная 2.5D изометрическая бизнес-игра в стиле dollhouse. Пользователь регистрируется, создаёт компанию с логотипом, выбирает аватар и стиль офиса, затем наблюдает анимированную сцену входа в офис. Офис физически растёт по мере прогресса: нанятые AI-сотрудники появляются как игровые персонажи. Все данные хранятся в AsyncStorage."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
